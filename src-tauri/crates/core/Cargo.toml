[package]
name = "sidekyk-core"
description = "Sidekyk without Tauri: the modules, their primitives, the git CLI, the watcher, the helper's protocol and the WSL transport."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror = "2"
notify-debouncer-mini = "0.7"
tracing.workspace = true
# The palette's fuzzy matching (fzf's scoring). Without `unicode-segmentation`, a match's indices
# count code points, which `modules/search` turns into the frontend's UTF-16 offsets.
nucleo-matcher = { version = "0.3", default-features = false, features = ["unicode-normalization", "unicode-casefold"] }
# Search in contents (ripgrep's libraries): files read through a fixed buffer, binaries skipped,
# UTF-16 transcoded by BOM; same speed as our own `regex` loop, 4-5x less memory (2026-10-17).
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
# Syntax colors: TextMate-style grammars, the ~220 of `bat` (two-face), one engine for every
# language. Chosen over tree-sitter for one stable engine and steady memory (7-16 MB); 4-10x
# slower, which matters only on large files (2026-10-18, docs/features/syntax-colors.md).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
# Files of a folder without git (ripgrep's walker and gitignore matcher): `.gitignore`, `.ignore`
# and git's global excludes as git applies them, a parallel walk (2026-10-24, chosen over
# `walkdir` plus our own parser, `jwalk`, `gix`'s dirwalk).
ignore = "0.4"
# The viewer's Markdown preview: events with their byte ranges, turned into a tree the frontend
# renders, so no HTML writer (2026-10-25, over comrak: 3x faster, half the memory on 2 MiB;
# `.local/markdown-renderers/`, docs/features/previews.md).
pulldown-cmark = { version = "0.13", default-features = false }
# Images in notes: the formats every webview shows, decoded within a pixel limit, and a thumbnail
# for the cards (2026-11-01, over a canvas in the webview: a 5K screenshot peaks at 84 MB against
# ~450 MB over two WebKit processes, and the same code on every system;
# `.local/note-thumbnails/`, docs/features/notes.md).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Mermaid diagrams in the preview, drawn in Rust and shown as an image (2026-11-08, over mermaid.js
# in the webview: 0.5-37 ms against 60-740 ms on the page's thread, 2 MB against 86-409 MB of
# WebContent; `.local/mermaid-renderers/`, docs/features/diagrams.md). Pinned: its API changes
# between minor versions. No ELK (EPL-2.0); `native-fonts` measures labels with the app's font.
merman = { version = "=0.9.3", default-features = false, features = ["all-diagrams", "complete-svg", "native-fonts"] }
# A diagram's font cut to its characters (Google's port of HarfBuzz's subsetter, variations
# kept), so the page, the labels' measure and the SVG share one font file: 0.2-1.2 ms, 25-55 KB
# of style against 137 KB for the woff2 whole (2026-11-08, over `subsetter`, made for PDFs only,
# and `fontcull`, a fork of the same code with C++ for woff2). Pinned, as merman.
skera = "=0.9.0"
read-fonts = { version = "0.46", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
