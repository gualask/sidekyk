[workspace]
members = ["crates/core", "crates/agent"]
# Every command run here (`cargo test`, `clippy`, `fmt`) covers the whole workspace.
default-members = [".", "crates/core", "crates/agent"]

# The app and the crates it ships are versioned together: one commit, no compatibility matrix.
[workspace.package]
version = "0.1.0"
authors = ["gualask"]
license = "MIT"
repository = "https://github.com/gualask/sidekyk"
edition = "2021"

[workspace.dependencies]
sidekyk-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
# `raw_value`: the helper's replies are read once, as the type the caller expects.
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
# Release builds compile every event below `info` out (see `infrastructure/logging.rs`).
tracing = { version = "0.1", default-features = false, features = ["std", "release_max_level_info"] }
# Text output only: no ANSI colors, no `env-filter` (and its regex engine), no `log` bridge.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }
tempfile = "3"

[package]
name = "sidekyk"
description = "Lightweight desktop companion for reviewing what changed in a local git working tree."
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
# `tauri dev` runs `cargo run` here, where the default members hold two binaries (the app and
# `sidekyk-agent`).
default-run = "sidekyk"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sidekyk_lib"
# Desktop only: the staticlib and cdylib of Tauri's template exist for iOS and Android, and on
# desktop they only add hundreds of megabytes to every build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sidekyk-core.workspace = true
# `tray-icon`: the change count in the tray (+235 KiB on the release binary with its menu). On
# Linux it loads libayatana-appindicator3 at runtime; without it the app runs with no tray.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Profiles tuned for disk use first: a full dev, test and clippy cycle takes about 1 GB of
# `target/` instead of 2.2 GB, at the cost of slower clean builds.
[profile.dev]
# File and line in backtraces, without full debug info.
debug = "line-tables-only"
# Incremental caches grow with every change and are never pruned.
incremental = false

[profile.dev.package."*"]
# Dependencies carry no debug info, and are lightly optimized: smaller artifacts and a faster
# dev app, built once.
debug = false
opt-level = 1

[profile.release]
# Whole-program optimization: a smaller, faster binary for a longer release build.
lto = true
codegen-units = 1
strip = "debuginfo"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

# The global shortcut that shows and hides the window (`global-hotkey`: Carbon hot keys on macOS,
# `RegisterHotKey` on Windows; idle until pressed). Not on Linux: its X11 backend wakes every
# 50 ms and Wayland has none, so there the desktop's own shortcut runs `sidekyk --toggle`.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
