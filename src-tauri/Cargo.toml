[package]
name = "sidekyk"
version = "0.1.0"
description = "Lightweight desktop companion for reviewing what changed in a local git working tree."
authors = ["gualask"]
license = "MIT"
repository = "https://github.com/gualask/sidekyk"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sidekyk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
notify-debouncer-mini = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 1
incremental = false

[profile.release]
# Whole-program optimization: a smaller, faster binary for a longer release build.
lto = true
codegen-units = 1
strip = "debuginfo"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"
