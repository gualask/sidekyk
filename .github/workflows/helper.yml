# The helper a WSL distro runs, shipped in the Windows installer (docs/features/wsl.md), as the
# run's artifacts `sidekyk-agent-linux-x64` and `-arm64`: called by build.yml and release.yml.
# arm64 for the container fixture on Apple Silicon (docs/testing.md), built on an arm64 runner, so
# musl-gcc builds its C natively.
name: Helper

on:
  workflow_call:
    inputs:
      arm64:
        description: arm64 too, for the container fixture; a release ships x64 alone
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  helper-linux:
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arm64 && '["x64", "arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # static, so it runs on any distro; C dependencies (oniguruma) built with musl's compiler
      - run: >-
          cargo build --release --locked -p sidekyk-agent --target ${{ env.TARGET }}
          --manifest-path src-tauri/Cargo.toml
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidekyk-agent-linux-${{ matrix.arch }}
          path: src-tauri/target/${{ env.TARGET }}/release/sidekyk-agent
          if-no-files-found: error
          retention-days: 14
