# A release on a tag `vX.Y.Z`, the workspace Cargo.toml's version (docs/features/updates.md):
# macOS (universal), Linux and Windows x64 built into a draft release while the checks (ci.yml)
# run; once both pass, latest.json is made from the draft's installers and the draft published.
# A failed build or check leaves the draft unpublished.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag names the workspace's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            --manifest-path src-tauri/Cargo.toml \
            | jq -r '.packages[] | select(.name == "sidekyk") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but src-tauri/Cargo.toml is at $version"
            exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml

  helper:
    uses: ./.github/workflows/helper.yml

  # made before the builds: each uploads into it, and a draft cannot be found by its tag
  draft:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Sidekyk ${GITHUB_REF_NAME#v}" \
            -F draft=true -F generate_release_notes=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  unix:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --config src-tauri/tauri.release.conf.json
          - runner: ubuntu-22.04
            targets: ''
            args: --config src-tauri/tauri.release.conf.json
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      release-id: ${{ needs.draft.outputs.id }}
      runner: ${{ matrix.runner }}
      rust-targets: ${{ matrix.targets }}
      args: ${{ matrix.args }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # the macOS job alone gets the code-signing certificate
      MACOS_CERTIFICATE: >-
        ${{ matrix.runner == 'macos-latest' && secrets.MACOS_CERTIFICATE || '' }}
      MACOS_CERTIFICATE_PASSWORD: >-
        ${{ matrix.runner == 'macos-latest' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}

  windows:
    needs: [draft, helper]
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      release-id: ${{ needs.draft.outputs.id }}
      runner: windows-latest
      args: --config src-tauri/tauri.helper.conf.json --config src-tauri/tauri.release.conf.json
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    needs: [draft, unix, windows, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: repos/${{ github.repository }}/releases/${{ needs.draft.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the updater manifest from the draft
        run: |
          gh api "$RELEASE" > draft.json
          python3 .github/scripts/updater-manifest.py draft.json "$GITHUB_REF_NAME" > latest.json
      - name: Upload and verify the manifest before publishing
        run: |
          previous=$(jq -r '.assets[] | select(.name == "latest.json") | .id' draft.json)
          if [ -n "$previous" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$previous"
          fi
          upload=$(jq -r '.upload_url | split("{")[0]' draft.json)
          asset=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @latest.json "$upload?name=latest.json" | jq -er '.id')
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" | cmp - latest.json
          gh api --method PATCH "$RELEASE" -F draft=false > /dev/null
        shell: bash
