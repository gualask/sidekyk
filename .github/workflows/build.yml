# An unsigned Windows x64 build, on demand, to try the app on Windows (WSL projects among them).
# Its installers are the run's artifact: Windows warns before running them (SmartScreen).
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the helper a WSL distro runs, shipped in the Windows installer (docs/plans/remote-projects.md)
  helper-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # static, so it runs on any distro; C dependencies (oniguruma) built with musl's compiler, as
      # Zed's script/bundle-linux
      - run: >-
          cargo build --release --locked -p sidekyk-agent --target x86_64-unknown-linux-musl
          --manifest-path src-tauri/Cargo.toml
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidekyk-agent-linux-x64
          path: src-tauri/target/x86_64-unknown-linux-musl/release/sidekyk-agent
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: helper-linux
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # where tauri.windows.conf.json takes it into the installer's resources
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sidekyk-agent-linux-x64
          path: src-tauri/resources/linux
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sidekyk-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
